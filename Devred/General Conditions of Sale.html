<script>
  (function() {
    var toast = document.getElementById('wishlist-toast');
    var hideTimeout;
    var addedTemplate = "__PRODUCT__ ajouté dans la liste de souhaits";
    var removedTemplate = "__PRODUCT__ retiré de la liste de souhaits";

    function showToast(message) {
      clearTimeout(hideTimeout);
      toast.textContent = message;
      toast.classList.add('is-visible');
      hideTimeout = setTimeout(function() {
        toast.classList.remove('is-visible');
      }, 2500);
    }

    document.addEventListener('ooo-wishlist:product-added', function(event) {
      var title = event.detail && event.detail.product && event.detail.product.title;
      showToast(addedTemplate.replace('__PRODUCT__', title || ''));
    });

    document.addEventListener('ooo-wishlist:product-removed', function(event) {
      var title = event.detail && event.detail.product && event.detail.product.title;
      showToast(removedTemplate.replace('__PRODUCT__', title || ''));
    });
  })();
</script>
